<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rettermayer WE</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="lib/JsBarcode.all.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
<style>
/* Layout: Tablet-Werkzeug für die Annahme am Hof. Blaue Kopfleiste mit Schrittfolge, weißes Arbeitsfeld mit großen Touch-Flächen, grüne Hauptaktion in der festen Fußleiste. */
:root{
  --bg:#f3f7fb; --panel:#ffffff; --ink:#0f2440; --muted:#56687e; --line:#d4dfea;
  --field:#1b5aa6; --field-ink:#ffffff; --accent:#2b9348; --accent-ink:#ffffff; --accent-soft:#e2f3e7;
  --ok:#23824a; --ok-soft:#dff1e6; --warn:#a96400; --warn-soft:#fbefd6; --bad:#b3261e; --bad-soft:#fbe1df;
  --info:#1b5aa6; --info-soft:#e1ecf8;
  --c-knf:#3f9a4a; --c-knt:#d9c49a; --c-kpg:#1b5aa6; --c-dark:#1a1f24; --c-light:#ffffff;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1726; --panel:#132338; --ink:#e6eef8; --muted:#9db0c6; --line:#263b54;
  --field:#7db0f0; --field-ink:#0a1828; --accent:#5cc27a; --accent-ink:#06200e; --accent-soft:#183a24;
  --ok:#6fd08f; --ok-soft:#173424; --warn:#f2b44c; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --info:#7db0f0; --info-soft:#17304f; --c-knf:#4fae5a; --c-kpg:#3f7fcf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1726; --panel:#132338; --ink:#e6eef8; --muted:#9db0c6; --line:#263b54;
  --field:#7db0f0; --field-ink:#0a1828; --accent:#5cc27a; --accent-ink:#06200e; --accent-soft:#183a24;
  --ok:#6fd08f; --ok-soft:#173424; --warn:#f2b44c; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --info:#7db0f0; --info-soft:#17304f; --c-knf:#4fae5a; --c-kpg:#3f7fcf; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--field)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--field);color:var(--field-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.1em;opacity:.85;margin-top:3px}
.tabs{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap;background:color-mix(in srgb,var(--field-ink) 16%,transparent);padding:4px;border-radius:999px}
.tabs button{background:transparent;color:var(--field-ink);border:0;border-radius:999px;padding:9px 16px;font:600 15px var(--f-body);cursor:pointer}
.tabs button[aria-current="true"]{background:var(--field-ink);color:var(--field)}
header.top .wrap.stepwrap{display:block;padding-block:0}
.steps{display:flex;align-items:flex-start;width:100%;padding-block:4px 14px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.st::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:4px;border-radius:2px;background:color-mix(in srgb,var(--field-ink) 25%,transparent);z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.now::before{background:var(--field-ink)}
.st .dot{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--f-body);background:var(--field);color:var(--field-ink);border:3px solid color-mix(in srgb,var(--field-ink) 45%,transparent);box-sizing:border-box}
.st.done .dot{background:var(--field-ink);color:var(--field);border-color:var(--field-ink)}
.st.now .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--field-ink);transform:scale(1.12)}
.st .lab{font:600 13px var(--f-body);text-align:center;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepcap{display:none;text-align:center;font:600 14px var(--f-body);padding-bottom:10px;margin-top:-6px}
@media (max-width:640px){.st .lab{display:none}.stepcap{display:block}}
main{padding-block:18px 130px;max-width:1100px;margin:0 auto}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:10px;min-height:170px;position:relative}
.tile:hover{border-color:var(--field)}
.tile .badge{width:72px;height:68px;border-radius:20px;display:grid;place-items:center;font:700 22px var(--f-mono);background:var(--cc);color:var(--cci);box-shadow:inset 0 -5px 0 color-mix(in srgb,#000 22%,transparent)}
.tile .name{font-weight:700;font-size:20px}
.tile .meta{color:var(--muted);font-size:14px;margin-top:auto}
.tile[aria-pressed="true"],.row-btn[aria-pressed="true"]{border-color:var(--accent);border-width:3px;background:var(--accent-soft)}
.tile[aria-pressed="true"]::after,.row-btn[aria-pressed="true"]::after{content:"✓";position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font:600 13px var(--f-body);white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mut{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row-btn{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 52px 12px 14px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;cursor:pointer;color:var(--ink);font:inherit;position:relative}
.row-btn>span{min-width:0}
.row-btn .code{display:grid;place-items:center;width:60px;height:56px;border-radius:16px;background:var(--field);color:var(--field-ink);font:700 18px var(--f-mono);box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 22%,transparent)}
.row-btn .sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],textarea,select{font:inherit;font-size:18px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
section.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;min-width:0}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.q .lbl{font-weight:600}
.q .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-width:56px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:700 20px var(--f-body);cursor:pointer;padding:0 12px}
.seg button[aria-pressed="true"].g-good{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.seg button[aria-pressed="true"].g-mid{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.seg button[aria-pressed="true"].g-bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.seg button[aria-pressed="true"].g-sel{background:var(--field);border-color:var(--field);color:var(--field-ink)}
.seg button[aria-pressed="true"]::before{content:"✓ ";font-size:.85em}
.seg.txt button{font-size:16px}
.seg.kal button{min-width:46px;font-size:16px;padding:0 6px}
.seg.kal button[aria-pressed="true"]::before{content:""}
.hint{font-size:14px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px color-mix(in srgb,var(--ink) 10%,transparent)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:12px;max-width:1100px;margin:0 auto}
.bar .msg{flex:1;min-width:0;color:var(--muted);font-size:14px}
.prog{height:6px;background:color-mix(in srgb,var(--muted) 18%,transparent)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--field),var(--accent));transition:width .3s ease;border-radius:0 3px 3px 0}
.btn{font:700 18px var(--f-body);border-radius:14px;padding:14px 22px;border:2px solid var(--field);background:var(--panel);color:var(--field);cursor:pointer;min-height:54px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--field);color:var(--field-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{font-size:15px;padding:8px 14px;min-height:42px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box}
.btn,.seg button,.tile,.row-btn{box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 18%,transparent);transition:transform .08s ease,box-shadow .08s ease}
.btn:active:not(:disabled),.seg button:active,.tile:active,.row-btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;color:var(--muted);min-height:120px}
.upl input{display:none}
.uplrow{display:grid;gap:10px;grid-template-columns:2fr 1fr}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:var(--bad);color:var(--panel);width:28px;height:28px;font-weight:700;cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;min-width:0}
.charge{font-family:var(--f-mono);font-weight:700;font-size:52px;letter-spacing:.04em;line-height:1}
.label-prev{width:100%;max-width:520px;aspect-ratio:2/1;background:#fff;color:#000;border-radius:6px;border:1px solid var(--line);padding:4% 5%;box-sizing:border-box;display:grid;grid-template-rows:auto auto 1fr;font-family:Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.label-prev .l1{display:flex;justify-content:space-between;gap:6px;font-size:clamp(9px,2.2vw,13px);font-weight:700;text-transform:uppercase}
.label-prev .l2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label-prev .l2 .lc{font-family:var(--f-mono);font-weight:700;font-size:clamp(22px,5.5vw,38px);white-space:nowrap}
.label-prev .l2 span{font-size:clamp(11px,2.6vw,16px);text-align:right}
.label-prev .frei{background:#000;color:#fff;padding:1px 6px;border-radius:2px}
.label-prev .l3{font-size:clamp(9px,2.2vw,13px)}
.label-prev svg{width:100%;height:auto;max-height:42%}
.etirow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border-radius:14px;background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:90px;text-align:center;font-family:var(--f-mono);font-size:24px;font-weight:700}
.stepper .btn{font-size:24px;min-width:48px;min-height:48px;padding:0}
.warnbox{border-left:5px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:8px}
.warnbox.okbox{border-color:var(--ok);background:var(--ok-soft)}
.warnbox.wbox{border-color:var(--warn);background:var(--warn-soft)}
.warnbox ul{margin:6px 0 0;padding-left:20px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.two>*{min-width:0}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;font-family:var(--f-mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.donechip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font:700 14px var(--f-body)}
.donechip.ok{background:var(--ok);color:var(--panel)}
.donechip.open{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.win{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:var(--ok-soft);border:2px solid var(--ok);margin-bottom:14px}
.win .chk{width:64px;height:64px;flex:none;border-radius:50%;background:var(--ok);color:var(--panel);display:grid;place-items:center;font-size:34px;font-weight:800}
.win.anim .chk{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.win b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1}
/* Bonitur-Tabelle im Feldfunk-Schema */
table.bon{width:100%;border-collapse:collapse;font-size:16px}
table.bon th,table.bon td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle}
table.bon th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
table.bon td.n{text-align:right;font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
table.bon input[type=number]{width:96px;text-align:right;font-family:var(--f-mono);padding:8px}
table.bon input[type=text]{min-width:140px;font-size:16px;padding:8px}
table.bon tr.sum td{border-top:2px solid var(--ink);font-weight:700}
table.bon tr.okrow td{color:var(--ok);font-weight:700}
.calc{font-family:var(--f-mono);font-weight:700;font-size:22px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px;color:var(--muted)}
:root{--bayern:#1e8fd6}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{height:48px;flex:none;border-radius:12px;border:3px solid #fff;box-shadow:0 3px 0 color-mix(in srgb,#000 25%,transparent);display:grid;place-items:center;overflow:hidden}
.emblem.logo{background:#fff;width:auto;min-width:48px;padding:3px 6px;box-sizing:border-box}
.emblem.logo img{max-height:38px;max-width:120px;display:block}
/* Spielstand */
.score{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:18px;position:relative;overflow:hidden}
.score>*{min-width:0}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),color-mix(in srgb,var(--muted) 18%,transparent) 0);display:grid;place-items:center}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 26px var(--f-display);line-height:1;text-align:center}
.ring b small{display:block;font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lvname{font:700 22px var(--f-display);line-height:1.1}
.xpbar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--muted) 16%,transparent);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--bayern),var(--accent));border-radius:999px;transition:width .6s ease}
.next{text-align:center;max-width:150px}
.next .medal{margin:0 auto 4px}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-mono);background:var(--accent);color:var(--accent-ink);border:3px solid color-mix(in srgb,var(--accent) 55%,#000);box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 20%,transparent)}
.medal.locked{background:color-mix(in srgb,var(--muted) 15%,var(--panel));color:var(--muted);border-color:var(--line);box-shadow:none}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bdg{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--panel)}
.bdg.done{border-color:var(--accent);background:var(--accent-soft)}
.bdg b{font-size:15px;line-height:1.2}
.bdg span{font-size:13px;color:var(--muted)}
.minibar{width:100%;height:6px;border-radius:999px;background:color-mix(in srgb,var(--muted) 16%,transparent);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--bayern)}
.board .rank{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-mono);background:color-mix(in srgb,var(--muted) 15%,transparent)}
.board tr:nth-child(1) .rank{background:#e8b923;color:#2a2000}
.board tr:nth-child(2) .rank{background:#c3ccd6;color:#1b2430}
.board tr:nth-child(3) .rank{background:#c98a4b;color:#2a1600}
.board tr.me td{background:var(--info-soft)}
.gain{font:700 44px var(--f-display);color:var(--accent);line-height:1}
.newbdg{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.newbdg .bdg{min-width:130px;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
.donechip.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.ptsprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border-radius:14px;background:var(--info-soft)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.scrollhint{display:flex;align-items:center;gap:8px;font:700 14px var(--f-body);color:var(--info);background:var(--info-soft);border-radius:10px;padding:8px 12px;margin-bottom:8px;animation:nudge 1.6s ease-in-out 2}

const $ = s=>document.querySelector(s);

function isoDate(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function deDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; }
const num = v=>{ const n=parseFloat(String(v??"").replace(",",".")); return isNaN(n)?null:n; };
const deNum = (n,d=0)=>n===null||n===undefined?"":Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
function prod(k){ return PROD.find(x=>x.k===k); }
const P = ()=>prod(S.prod);
const isPG = ()=>P()?.typ==="pflanzgut";
const isTR = ()=>P()?.typ==="trocken";

function saisonJahr(p, iso){ const m=new Date(iso+"T12:00:00").getMonth()+1, y=new Date(iso+"T12:00:00").getFullYear(); return m>=p.von ? y : y-1; }
function saisonLabel(p, sj){ return p.bis<p.von ? sj+"/"+String((sj+1)%100).padStart(2,"0") : String(sj); }
function inSaison(p, iso){ const m=new Date(iso+"T12:00:00").getMonth()+1; return p.bis>=p.von ? (m>=p.von&&m<=p.bis) : (m>=p.von||m<=p.bis); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>el.hidden=true,2800); }
function ascii(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase(); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Kopiert"); }catch(e){ toast("Bitte Text markieren und kopieren"); } }
function counterKey(){ const p=P(); return S.erz.code+"_"+p.k+"_"+saisonJahr(p,S.datum); }
function kalKlassen(p){ const g=(p.grenzen||[]).slice().sort((a,b)=>a-b); if(!g.length) return [];
  const out=[{t:`unter ${g[0]} g`,typ:"unter"}]; const ub=p.unterBis||g[0];
  for(let i=0;i<g.length-1;i++) out.push({t:`${g[i]}–${g[i+1]} g`,typ:g[i+1]<=ub?"unter":"normal"});
  out.push({t:`über ${g[g.length-1]} g`,typ:"ueber"}); return out; }
function mangelListe(p){ return (p.maengel||[]).map(m=>({t:String(m).replace(/\*$/,"").trim(), info:/\*$/.test(String(m))})); }
function kalSumme(){ return Object.values(S.kal).reduce((a,b)=>a+b,0); }
function kalAusreisser(){ const kl=kalKlassen(P()); let u=0,o=0; kl.forEach((c,i)=>{ if(c.typ==="unter") u+=S.kal[i]||0; if(c.typ==="ueber") o+=S.kal[i]||0; }); return {u,o}; }
function kalText(){ return kalKlassen(P()).map((c,i)=>`${c.t}: ${S.kal[i]||0} %`).join(" · "); }
function mangelText(){ const l=mangelListe(P()).map((m,i)=>({...m,r:S.mg[i]||0})).filter(x=>x.r); return l.length? l.map(x=>`${x.t} ${RANGES[x.r].t}`).join(" · ") : "keine"; }
const tempText=()=>(TEMP.find(x=>x.v===S.temp)||{t:"–"}).t;
const fallText=()=>(FALLEND.find(x=>x.v===S.fallend)||{t:"–"}).t;
const trockText=()=>(TROCK.find(x=>x.v===S.trock)||{t:"–"}).t;
const qualText=q=>(QUAL.find(x=>x.v===(q||S.pg.qual))||{t:"–"}).t;
function auslobText(){ return isPG()? qualText() : ([...S.verband].join(", ")||"kein Verband"); }
function pgCalc(){
  const ml=mangelListe(P()); const n=num(S.pg.anzahl)||0;
  const cnts=ml.map((m,i)=>num(S.pg.cnt[i])||0);
  const sum=cnts.reduce((a,b)=>a+b,0);
  const pct=c=>n>0?Math.round(c/n*100):0;
  const fus=ml.reduce((a,m,i)=>/fusarium/i.test(m.t)?a+cnts[i]:a,0);
  const g=num(S.pg.gewicht); const zg=(g&&n)?Math.round(g*1000/n*100)/100:null;
  return {ml,n,cnts,sum,ohne:Math.max(0,n-sum),pct,sumPct:pct(sum),ohnePct:n?100-pct(sum):0,fus,fusPct:pct(fus),zg};
}

/* ---------- Abweichungen ---------- */
let AB_OVERRIDE=null;
function abweichungen(){
  if(AB_OVERRIDE) return AB_OVERRIDE;
  const out=[]; const p=P(), e=S.erz; if(!p||!e) return out;
  plausi().forEach(x=>out.push("Plausibilität: "+x));
  if(isPG()){
    const c=pgCalc();
    if(c.n&&c.sumPct>p.tol) out.push(`Mängel gesamt ${c.sumPct} % (Toleranz ${p.tol} %)`);
    if(c.n&&c.fusPct>(p.ftol??10)) out.push(`Fusarium gesamt ${c.fusPct} % (Toleranz ${p.ftol??10} %)`);
  } else {
    if(S.temp==="frost") out.push("Frostschaden"); if(S.temp==="hitze") out.push("Hitzeschaden");
    NOTEN.forEach(n=>{ if(S.noten[n.id]>=4) out.push(`${n.t}: Note ${S.noten[n.id]}`); });
    if(isFR()){ const {u,o}=kalAusreisser(); if(u+o>p.tol) out.push(`Unter-/Übergröße ${u+o} % (Untergröße ${u} %, Übergröße ${o} %), Toleranz ${p.tol} %`); }
    if(isTR() && S.trock==="feucht") out.push("Ware feucht, nicht lagerfähig abgetrocknet");
    if(isTR()) schwundAbw(num(S.menge),S.kl).forEach(x=>out.push(x));
    mangelListe(p).forEach((m,i)=>{ const r=S.mg[i]||0; if(!m.info && rBis(r)>p.mtol) out.push(`Mangel ${m.t}: ${RANGES[r].t} (Toleranz ${p.mtol} %)`); });
    if(S.sauber===false) out.push("Sauberkeit nicht in Ordnung");
    const soll=new Set(e.verbaende||[]);
    VERB.forEach(v=>{
      if(soll.has(v)&&!S.verband.has(v)) out.push(`${v} laut Stammdaten, auf Ware nicht ausgelobt`);
      if(!soll.has(v)&&S.verband.has(v)) out.push(`${v} ausgelobt, in Stammdaten nicht hinterlegt`);
    });
  }
  JN().forEach(q=>{ if(S.jn[q.id]===false) out.push(`Nein: ${q.t}`); });
  if(S.keinLs&&!isPG()) out.push("Kein Lieferschein vorhanden");
  if(!S.keinLs) (S.lsCheck||[]).forEach(r=>{ if(r.status==="fehlt") out.push(`Lieferschein: ${r.punkt} fehlt`); if(r.status==="abweichend") out.push(`Lieferschein: ${r.punkt} abweichend (${r.ist||"–"})`); });
  return out;
}
function plausi(){
  const out=[]; const p=P(); if(!p) return out;
  const m=num(S.menge), max=p.maxKg||20000;
  if(m!==null && m>max) out.push(`Menge ${deNum(m)} kg liegt über der Plausibilitätsgrenze von ${deNum(max)} kg`);
  if(m!==null && m<=0) out.push("Menge muss größer als 0 kg sein");
  const ki=num(S.kisten); if(ki!==null && ki>2000) out.push(`${ki} Gebinde wirken sehr hoch, bitte prüfen`);
  const heute=isoDate(new Date()), d=S.datum;
  if(d && d>heute) out.push("Anliefertag liegt in der Zukunft");
  if(d && (new Date(heute)-new Date(d))/864e5>3) out.push("Anliefertag liegt mehr als 3 Tage zurück");
  if(d && !inSaison(p,d)) out.push(`${p.name} außerhalb der hinterlegten Saison (${MON[p.von]}–${MON[p.bis]})`);
  return out;
}
function plausiBox(){ const p=plausi(); return p.length?`<div class="warnbox wbox"><b>Bitte prüfen</b><ul>${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""; }

/* ---------- Validierung ---------- */
function missing(){
  if(step===0) return S.prod?null:"Bitte ein Produkt wählen";
  if(step===1) return S.erz?null:(isPG()?"Bitte einen Lieferanten wählen":"Bitte einen Erzeuger wählen");
  if(step===2){ if(!S.datum) return "Bitte Anliefertag angeben"; if(!S.gebinde) return "Bitte Gebinde wählen"; return null; }
  if(step===3){
    const m=[];
    if(isPG()){
      const c=pgCalc();
      if(!(c.n>0)) m.push("Anzahl Zehen"); if(!num(S.pg.gewicht)) m.push("Gesamtgewicht");
      if(!S.pg.form) m.push("ganze Knollen / gebrochen");
      if(c.n>0 && c.sum>c.n) return `Summe Mängel (${c.sum}) größer als Anzahl Zehen (${c.n})`;
    } else {
      NOTEN.forEach(n=>{ if(!S.noten[n.id]) m.push(n.t); });
      if(isFR()){ if(kalSumme()!==100) m.push(`Kaliber (Summe ${kalSumme()} %)`); if(P().ernteart && !S.ernte) m.push("Ernteart"); }
      if(isTR()){ if(!S.fallend) m.push("Sortierung fallend"); if(!S.trock) m.push("Abtrocknung"); }
      if(S.sauber===null) m.push("Sauberkeit");
      if(!S.temp) m.push("Temperatur");
    }
    JN().forEach(q=>{ if(S.jn[q.id]===undefined) m.push(q.t.split(" ")[0]); });
    return m.length? (m.length>3? `Noch ${m.length} Angaben offen` : "Noch offen: "+m.join(", ")) : null;
  }
  if(step===4) return (S.lsFoto||isPG()||S.keinLs)?null:"Bitte Lieferschein fotografieren oder „Kein Lieferschein“ wählen";
  return null;
}

function updBar(){

function secDone(id){
  if(id==="bew") return NOTEN.every(n=>S.noten[n.id]) && S.sauber!==null && !!S.temp;
  if(id==="jn") return JN().every(q=>S.jn[q.id]!==undefined);
  if(id==="kal") return kalSumme()===100;
  if(id==="sort") return !!S.fallend && !!S.trock;
  if(id==="pgkopf") return !!S.pg.form && !!num(S.pg.gewicht);
  if(id==="pgbon") { const c=pgCalc(); return c.n>0 && c.sum<=c.n; }
  return false;
}
function chip(ok,id,key){ let pop=""; if(ok&&key&&!S.seen.has(key)){ S.seen.add(key); pop=" pop"; } return `<span class="donechip ${ok?"ok":"open"}${pop}"${id?` id="${id}"`:""}>${ok?"✓ erledigt":"offen"}</span>`; }

/* ---------- Spielstand: Punkte, Level, Erfolge ---------- */
const LEVELS=["Neuling","Annehmer","Prüfer","Knollenkenner","Zehenzähler","Partiemeister","Obermeister","Knoblauchkönig"];
const ERFOLGE=[
  {id:"first",g:"1",t:"Erste Charge",d:"Ersten Wareneingang gespeichert",z:1,f:s=>s.n},

const dayKey=v=>isoDate(new Date(v.erstellt));
const meine=()=>VORG.filter(v=>v.erfasstVon===ME);
function punkte(){
  const b=[["Wareneingang erfasst",10]];
  if(S.lsFoto) b.push(["Lieferschein fotografiert",5]);
  if(S.lsCheck&&S.lsCheck.length&&S.lsCheck.every(r=>r.status!=="offen")) b.push(["Lieferschein abgeglichen",5]);
  const f=Math.min(3,S.fotos.length); if(f) b.push([`${f} Warenfoto${f>1?"s":""}`,f*2]);
  if(isPG()) b.push(["Bonitur gezählt",10]);
  if(isTR()&&klCount(S.kl)) b.push([`${klCount(S.kl)} Kisten verwogen`,Math.min(10,klCount(S.kl))]);
  if(S.datum===isoDate(new Date())) b.push(["Am Anliefertag erfasst",3]);
  if(S.bem.trim()) b.push(["Bemerkung notiert",2]);
  return {list:b, sum:b.reduce((a,x)=>a+x[1],0)};
}
function statsFor(list){
  const days=[...new Set(list.map(dayKey))].sort();
  let best=0,run=0,prev=null; days.forEach(d=>{ run=(prev&&(new Date(d)-new Date(prev))/864e5===1)?run+1:1; best=Math.max(best,run); prev=d; });
  const has=new Set(days); let cur=0; const dd=new Date(); if(!has.has(isoDate(dd))) dd.setDate(dd.getDate()-1); while(has.has(isoDate(dd))){ cur++; dd.setDate(dd.getDate()-1); }
  return {n:list.length, pts:list.reduce((a,v)=>a+(v.punkte||0),0), kpg:list.filter(v=>v.produkt==="KPG").length, zehen:list.reduce((a,v)=>a+(v.bonitur?.anzahlZehen||0),0),
    fotos:list.reduce((a,v)=>a+(v.fotos||0),0), prods:new Set(list.map(v=>v.produkt)).size, frueh:list.some(v=>new Date(v.erstellt).getHours()<7)?1:0,
    lsok:list.filter(v=>(v.lieferscheinAbgleich||[]).length&&v.lieferscheinAbgleich.every(r=>r.status==="ok")).length, best, streak:cur};
}
function erfolge(s){ return ERFOLGE.map(e=>{ const ist=e.f(s); return {...e, ist, done:ist>=e.z}; }); }
function lvl(pts){ const l=Math.floor(pts/100); return {nr:l+1, name:LEVELS[Math.min(l,LEVELS.length-1)], prog:pts%100}; }
function medal(e){ return `<div class="medal${e.done?"":" locked"}">${esc(e.g)}</div>`; }
function bdgTile(e){ return `<div class="bdg${e.done?" done":""}">${medal(e)}<b>${esc(e.t)}</b><span>${esc(e.d)}</span>${e.done?`<span class="pill p-ok">geschafft</span>`:`<div class="minibar"><i style="width:${Math.min(100,e.ist/e.z*100)}%"></i></div><span>${deNum(Math.min(e.ist,e.z))} / ${deNum(e.z)}</span>`}</div>`; }
function scoreCard(){
  const mine=meine(), s=statsFor(mine), L=lvl(s.pts), today=isoDate(new Date());
  const heute=mine.filter(v=>dayKey(v)===today).length, team=VORG.filter(v=>dayKey(v)===today).length;
  const nb=erfolge(s).filter(e=>!e.done).sort((a,b)=>b.ist/b.z-a.ist/a.z)[0];
  return `<section class="score"><div class="ring" style="--p:${L.prog}"><b><span><small>Level</small>${L.nr}</span></b></div>

async function resolveNames(ids){
  if(!user||!ids.length) return; const miss=ids.filter(id=>!(id in NAMES)); if(!miss.length) return;
  try{ const ps=await user.profiles(miss); let ch=false; miss.forEach(id=>{ NAMES[id]=ps?.[id]?.name||""; ch=ch||!!NAMES[id]; }); if(ch&&(view==="team"||(view==="erf"&&step===0))) render(); }catch(_){ miss.forEach(id=>NAMES[id]=""); }
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"); c.hidden=false; const w=c.width=innerWidth, h=c.height=innerHeight; const g=c.getContext("2d");
  const cols=["#1e8fd6","#ffffff","#2b9348","#1b5aa6","#9fd3ff"];
  const ps=Array.from({length:150},()=>({x:w/2+(Math.random()-.5)*w*.4,y:h*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*7+5,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],d:Math.random()<.6}));
  let t=0; (function f(){ g.clearRect(0,0,w,h);
    ps.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle=p.c; g.strokeStyle="rgba(15,36,64,.35)"; g.lineWidth=1;
      if(p.d){ g.beginPath(); g.arc(0,0,p.r*.45,0,7); g.fill(); g.stroke(); } else { g.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66); g.strokeRect(-p.r/2,-p.r/3,p.r,p.r*.66); }
      g.restore(); });
    if(++t<120) requestAnimationFrame(f); else { g.clearRect(0,0,w,h); c.hidden=true; } })();
}

const txt2=s=>String(s).replace(/[–—]/g,"-");
function klSum(l){ return l.reduce((a,x)=>a+(num(x.kg)||0),0); }
function klCount(l){ return (l||[]).filter(x=>num(x.kg)).length; }
function schwund(ls,l){ const e=klSum(l); if(!ls||!e) return null; const d=Math.round((ls-e)*10)/10; return {e,d,pct:Math.round(d/ls*1000)/10}; }
function swText(sw){ if(!sw) return "–"; return `${sw.d>=0?"−":"+"}${deNum(Math.abs(sw.d),1)} kg · ${deNum(Math.abs(sw.pct),1)} %${sw.d>=0?" Schwund":" mehr"}`; }
function schwundAbw(ls,l){ const sw=schwund(ls,l), t=prod("KNT")?.stol??5, o=[]; if(!sw) return o;
  if(sw.pct>t) o.push(`Schwund nach Kalibrierung/Bürsten ${deNum(sw.pct,1)} % (${deNum(sw.d,1)} kg), Toleranz ${t} %`);
  if(sw.d<0) o.push(`Menge erfasst liegt ${deNum(-sw.d,1)} kg (${deNum(-sw.pct,1)} %) über der Lieferschein-Menge`); return o; }
const KISTE_MAX=1000;
function klWarn(sw){ return sw&&sw.d<0?`<div class="warnbox"><b>Menge erfasst liegt über der Lieferschein-Menge</b><br>${deNum(-sw.d,1)} kg (${deNum(-sw.pct,1)} %) mehr als auf dem Lieferschein. Bitte Gewichte und Lieferschein prüfen.</div>`:""; }
function kalGroups(l){ const g={}; l.filter(x=>num(x.kg)).forEach(x=>{ const k=x.kal||"ohne Kaliber"; (g[k]=g[k]||{n:0,kg:0}); g[k].n++; g[k].kg+=num(x.kg); }); return g; }
function kalSumText(l){ return Object.entries(kalGroups(l)).map(([k,v])=>`${k}: ${v.n} Kisten, ${deNum(v.kg,1)} kg`).join(" · ")||"-"; }
function kalSumHtml(l){ const g=Object.entries(kalGroups(l)); return g.length?`<div class="chips">${g.map(([k,v])=>`<span class="pill p-mut">${esc(k)}: ${v.n} Kiste${v.n>1?"n":""} · ${deNum(v.kg,1)} kg</span>`).join("")}</div>`:""; }
const curKL=()=>view==="ueb"?S.kEdit?.liste:S.kl;

    verband:new Set(v.verband||[]), ernte:v.ernteart??null, trock:v.abtrocknung??null, etiAnz:v.etiketten||null, keinLs:!!v.keinLieferschein, kl:(v.kistenListe||[]).map(x=>({kal:x.kal||"",kg:str(x.kg)}))});
  (v.kaliber||[]).forEach((k,i)=>st.kal[i]=k.prozent||0);
  if(p&&v.maengel&&p.typ!=="pflanzgut"){ const ml=mangelListe(p); v.maengel.forEach(m=>{ const i=ml.findIndex(x=>x.t===m.mangel); const ri=RANGES.findIndex(x=>x.von===m.von&&x.bis===m.bis); if(i>=0&&ri>0) st.mg[i]=ri; }); }
  const f=FALLEND.find(x=>(v.sortierung||"").includes(x.t)); if(f) st.fallend=f.v;
  if(v.bonitur&&p){ const b=v.bonitur; st.pg={...freshPg(), auftrag:b.auftraggeber||"VG Bio", probennehmer:b.probennehmer||"", probeDatum:b.probeDatum||"", land:b.herkunftsland||"", sorte:b.sorte||"",
      kaliber:b.kaliber||"", form:b.form||null, brech:b.brechstelle||"", gewicht:str(b.gesamtgewichtKg), anzahl:str(b.anzahlZehen), eindruck:b.eindruck||"", qual:v.qualitaet||"konv", cnt:{}, anm:{}};

  return st;

let PDFV=null, pdfjsReady=null;
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
function pdfjs(){ if(!pdfjsReady) pdfjsReady=(async()=>{ const b="lib/pdfjs/"; await loadScript(b+"pdf.min.js"); await loadScript(b+"pdf.worker.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc=b+"pdf.worker.min.js"; return window.pdfjsLib; })().catch(e=>{ pdfjsReady=null; throw e; }); return pdfjsReady; }
async function showPdf(buf,name,title){
  const v=$("#pdfv"), box=$("#pdfv-p"); v.hidden=false; document.body.style.overflow="hidden"; $("#pdfv-t").textContent=title; PDFV={buf,name};
  box.innerHTML=`<p style="color:#fff;font-weight:600">PDF wird geladen …</p>`;
  try{ const lib=await pdfjs(); const doc=await lib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false}).promise;
    if(!PDFV) return; box.innerHTML=""; const w=Math.min(box.clientWidth-32,900), dpr=Math.min(2,window.devicePixelRatio||1);
    for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const vp0=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:w/vp0.width*dpr});
      const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height); c.setAttribute("aria-label","Seite "+i); box.appendChild(c);
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; if(!PDFV) return; } }
  catch(e){ box.innerHTML=`<div class="warnbox" style="max-width:520px;background:var(--panel)">Das PDF lässt sich hier nicht anzeigen. Über „Speichern“ kannst du es herunterladen und öffnen.</div>`; }
}

/* ---------- Auswertung (wie GBB-App, angepasst an Knoblauch trocken/frisch/Pflanzgut) ---------- */
const AW={prod:"alle", saison:null, vgl:"auto", demo:false, gleich:true};
function seasonStart(k,sj){ return new Date(sj,k.von-1,1); }
function seasonEnd(k,sj){ const y=k.bis<k.von?sj+1:sj; return new Date(y,k.bis,0); }
function demoDaten(){
  let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const erz=[["AHO","Hof Aigner (Beispiel)"],["BHO","Hof Berger (Beispiel)"],["CHO","Hof Christl (Beispiel)"],["DHO","Hof Dorn (Beispiel)"]];
  const lief=[["PAX","Pflanzgut Iberia (Beispiel)"],["FRX","Ail de France (Beispiel)"]];
  const plan={KNT:erz.slice(0,4),KNF:erz.slice(0,2),KPG:lief};
  const out=[]; const thisYear=new Date().getFullYear();
  Object.entries(plan).forEach(([pk,list])=>{ const k=prod(pk); if(!k) return;
    list.forEach(([code,name],ci)=>{
      [thisYear-1,thisYear].forEach((sj,si)=>{ const st=seasonStart(k,sj), en=seasonEnd(k,sj); const span=(en-st)/864e5;
        const startOff=span*(0.03+rnd()*0.15)+(si?-5:3)*ci, endOff=span*(0.45+rnd()*0.5); const n=pk==="KPG"?2+Math.floor(rnd()*3):3+Math.floor(rnd()*7);
        for(let i=0;i<n;i++){ const dt=new Date(st.getTime()+(startOff+(endOff-startOff)*i/Math.max(1,n-1)+rnd()*4)*864e5); if(dt>new Date()) continue;
          const q=Math.min(5,Math.max(1,Math.round(1.5+rnd()*1.8+(code==="CHO"&&si?0.8:0)))); const menge=Math.round(1+rnd()*8)*500;
          const r={produkt:pk,produktName:k.name,erzeuger:name,code,datum:isoDate(dt),mengeKg:menge,abweichungen:[]};
          if(pk==="KPG"){ const sumP=Math.round(8+rnd()*40), fus=Math.round(sumP*(0.2+rnd()*0.4)); r.bonitur={summeProzent:sumP,fusariumProzent:fus,summe:1}; r.zehengewicht=Math.round((4.2+rnd()*2.4)*100)/100; if(sumP>p_tol(k)||fus>(k.ftol??10)) r.abweichungen.push("Beispiel"); }
          else { r.noten={q,v:Math.min(4,Math.max(1,Math.round(1+rnd()*2)))}; const mg=rnd()<0.25; r.maengel=mg?[{mangel:"Schimmel",von:0,bis:10}]:[];
            if(pk==="KNT"){ const sw=Math.round((1+rnd()*rnd()*12)*10)/10; r.schwundProzent=sw; r.mengeErfasst=Math.round(menge*(1-sw/100)); if(sw>(k.stol??5)) r.abweichungen.push("Beispiel"); }
            if(pk==="KNF"){ const uo=Math.round(rnd()*rnd()*3)*10; r.kaliber=[{typ:"unter",prozent:uo/2},{typ:"normal",prozent:100-uo},{typ:"ueber",prozent:uo/2}]; if(uo>k.tol) r.abweichungen.push("Beispiel"); }
            if(q>=4||mg&&rnd()<0.5) r.abweichungen.push("Beispiel"); }
          out.push(r); } }); }); });
  return out;
}
function p_tol(k){ return k.tol??15; }
function awDaten(){
  const src=AW.demo?demoDaten():VORG;
  return src.map(r=>{ const k=prod(r.produkt); if(!k||!r.datum) return null; const sj=saisonJahr(k,r.datum);
    const uo=r.kaliber?(r.kaliber||[]).filter(c=>c.typ!=="normal").reduce((a,c)=>a+(c.prozent||0),0):null;
    const mg=(r.maengel||[]).some(m=>!m.info&&(m.bis||0)>0)||((r.bonitur?.summeProzent||0)>0);
    return {k, bc:k.k, sj, erz:r.erzeuger||"–", code:r.code||"", datum:r.datum, menge:+r.mengeKg||0, q:r.noten?.q,
      uo, sw:r.schwundProzent??null, erf:r.mengeErfasst??null, mgp:r.bonitur?.summeProzent??null, fus:r.bonitur?.fusariumProzent??null, zg:r.zehengewicht??null,
      mg, abw:(r.abweichungen||[]).filter(a=>!/^Plausibilität/.test(a)).length>0, charge:r.charge||""}; }).filter(Boolean);
}
const avgOf=(l,f)=>{ const v=l.map(f).filter(x=>x!=null&&!isNaN(x)); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; };
function agg(list){
  const n=list.length; if(!n) return null; const ds=list.map(x=>x.datum).sort();
  return {n, menge:list.reduce((a,x)=>a+x.menge,0), erf:list.reduce((a,x)=>a+(x.erf||0),0), q:avgOf(list,x=>x.q), uo:avgOf(list,x=>x.uo), sw:avgOf(list,x=>x.sw),
    mgp:avgOf(list,x=>x.mgp), fus:avgOf(list,x=>x.fus), zg:avgOf(list,x=>x.zg),
    mg:list.filter(x=>x.mg).length/n, abw:list.filter(x=>x.abw).length/n, von:ds[0], bis:ds[ds.length-1]};
}
const fT=kg=>kg>=1000?(kg/1000).toLocaleString("de-DE",{maximumFractionDigits:1})+" t":Math.round(kg).toLocaleString("de-DE")+" kg";
const fP=x=>x==null?"–":Math.round(x*100)+" %";
const fN=x=>x==null?"–":x.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const fPc=x=>x==null?"–":fN(x)+" %";
const dShort=iso=>{ if(!iso) return "–"; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y.slice(2)}`; };
function delta(a,b,kind){ // menge: höher = gut · note/quote/pkt: niedriger = gut
  if(a==null||b==null) return "";
  let diff, t;
  if(kind==="menge"){ if(!b) return ""; diff=(a-b)/b; t=(diff>0?"+":"")+Math.round(diff*100)+" %"; }
  else if(kind==="note"){ diff=a-b; t=(diff>0?"+":"")+diff.toLocaleString("de-DE",{maximumFractionDigits:1}); diff=-diff; }
  else if(kind==="pkt"){ diff=a-b; t=(diff>0?"+":"")+diff.toLocaleString("de-DE",{maximumFractionDigits:1})+" Pkt."; diff=-diff; }
  else if(kind==="neutral"){ diff=a-b; t=(diff>0?"+":"")+diff.toLocaleString("de-DE",{maximumFractionDigits:2}); return `<span class="dl">${t}</span>`; }
  else { diff=a-b; t=(diff>0?"+":"")+Math.round(diff*100)+" Pkt."; diff=-diff; }
  if(Math.abs(diff)<0.005) return `<span class="dl">±0</span>`;
  return `<span class="dl ${diff>0?"up":"down"}">${diff>0?"▲":"▼"} ${t}</span>`;
}
function kennzahl(bc,a){ if(!a) return "–";
  if(bc==="KNT") return a.sw!=null?`Schwund ${fPc(a.sw)}`:"Schwund –";
  if(bc==="KNF") return a.uo!=null?`U/Ü ${Math.round(a.uo)} %`:"–";
  if(bc==="KPG") return a.mgp!=null?`Mängel ${Math.round(a.mgp)} % · Fus. ${Math.round(a.fus??0)} %`:"–";

const B_ROW=46;
function timelineSvg(k,rows,cur,prev,sjA,sjB){
  const W=1000, padL=210, padR=16, rowH=B_ROW, top=26; const H=top+rows.length*rowH+8;
  const months=[]; let m=k.von, cnt=0; do{ months.push(m); m=m%12+1; cnt++; }while(months[months.length-1]!==k.bis&&cnt<12);
  const span=(seasonEnd(k,2001)-seasonStart(k,2001))/864e5+1;
  const xOf=(iso,sj)=>{ const dd=(new Date(iso+"T12:00:00")-seasonStart(k,sj))/864e5; return padL+(W-padL-padR)*Math.max(0,Math.min(1,dd/span)); };
  const maxM=Math.max(1,...cur.concat(prev).filter(x=>x.bc===k.k).map(x=>x.menge));
  const rad=mg=>4+6*Math.sqrt(mg/maxM);
  let x0=padL, grid=""; months.forEach((mo,i)=>{ const dd=new Date(2001+(mo<k.von?1:0),mo,0).getDate(); const w=(W-padL-padR)*dd/span;
    grid+=`<rect x="${x0}" y="${top-4}" width="${w}" height="${H-top}" class="${i%2?"band2":"band1"}"/><text x="${x0+w/2}" y="${top-10}" class="ax" text-anchor="middle">${MON[mo]}</text>`; x0+=w; });
  const todayIso=isoDate(new Date()); const tx=(saisonJahr(k,todayIso)===sjA&&inSaison(k,todayIso))?xOf(todayIso,sjA):null;
  const dots=(list,sj,cls,dy)=>list.map(x=>`<circle cx="${xOf(x.datum,sj).toFixed(1)}" cy="${dy}" r="${rad(x.menge).toFixed(1)}" class="${cls}" data-tip="${esc(`${x.erz} · ${dShort(x.datum)} · ${fT(x.menge)}${x.q?" · Note "+x.q:""}${x.sw!=null?" · Schwund "+fPc(x.sw):""}${x.mgp!=null?" · Mängel "+Math.round(x.mgp)+" %":""}${x.abw?" · mit Abweichung":""}`)}"/>`).join("");
  const body=rows.map((r,i)=>{ const y=top+i*rowH; const ya=y+rowH*0.36, yb=y+rowH*0.74;
    const sa=cur.filter(x=>x.bc===r.bc&&x.erz===r.erz).sort((p,q)=>p.datum.localeCompare(q.datum)), sb=prev.filter(x=>x.bc===r.bc&&x.erz===r.erz).sort((p,q)=>p.datum.localeCompare(q.datum));
    const spanLine=(l,sj,yy,cls)=>l.length>1?`<line x1="${xOf(l[0].datum,sj)}" x2="${xOf(l[l.length-1].datum,sj)}" y1="${yy}" y2="${yy}" class="${cls}"/>`:"";
    return `<text x="8" y="${y+rowH*0.45}" class="rl">${esc(r.erz.length>28?r.erz.slice(0,27)+"…":r.erz)}</text>
      <text x="8" y="${y+rowH*0.8}" class="rs">${r.a?`${r.a.n} Lief. · ${fT(r.a.menge)}`:"in dieser Saison keine"}</text>
      <line x1="${padL}" x2="${W-padR}" y1="${y+rowH}" y2="${y+rowH}" class="sep"/>
      ${spanLine(sa,sjA,ya,"spa")}${sjB!=null?spanLine(sb,sjB,yb,"spb"):""}${dots(sa,sjA,"da",ya)}${sjB!=null?dots(sb,sjB,"db",yb):""}`; }).join("");
  return `<div class="tlhead"><span class="kb" style="${kbStyle(k.k)}">${esc(k.k)}</span> <b>${esc(k.name)}</b> <span class="hint">Saison ${MON[k.von]}–${MON[k.bis]}</span></div>
    <div class="tlwrap"><svg viewBox="0 0 ${W} ${H}" class="tl" role="img" aria-label="Saisonzeitraum ${esc(k.name)}">${grid}${tx!=null?`<line x1="${tx}" x2="${tx}" y1="${top-4}" y2="${H}" class="today"/><text x="${tx+4}" y="${H-4}" class="ax">heute</text>`:""}${body}</svg></div>`;
}
function awCsv(){
  const rows=AW._rows||[]; const [la,lb]=AW._lab||["",""];
  const h=["Produkt","Erzeuger/Lieferant",`Lieferungen ${la}`,`Menge kg ${la}`,`Menge erfasst kg ${la}`,`Ø Note ${la}`,`Ø Schwund % ${la}`,`Ø Unter/Über % ${la}`,`Ø Mängelanteil % ${la}`,`Ø Fusarium % ${la}`,`Ø Zehengewicht g ${la}`,`Anteil mit Mängeln % ${la}`,`Anteil mit Abweichung % ${la}`,`Erste Anlieferung ${la}`,`Letzte Anlieferung ${la}`,`Lieferungen ${lb}`,`Menge kg ${lb}`,`Ø Note ${lb}`,`Erste Anlieferung ${lb}`,`Letzte Anlieferung ${lb}`];

  save(`Auswertung_Knoblauch_Rettermayer_${AW.prod}_${String(la).replace("/","-")}.csv`, new TextEncoder().encode("﻿"+lines.join("\r\n")).buffer, "Auswertung");

async function csvExport(list, mark){

}

function dataUrlToBlob(u){ const [h,b]=u.split(","); const bin=atob(b); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type:h.match(/:(.*?);/)[1]}); }

/* ---------- Lieferschein auslesen ---------- */
async function lsRead(){
  if(!sample){ S.lsMsg="Automatisches Auslesen ist in dieser Ansicht nicht verfügbar. Bitte Status je Zeile antippen."; render(); return; }
  S.lsBusy=true; S.lsMsg="Lieferschein wird gelesen, das dauert etwa eine halbe Minute …"; render();
  const prompt=`Du liest das Foto eines Lieferscheins für Knoblauch (Bio-Ware oder Pflanzgut) in Deutschland. Antworte NUR mit JSON in genau dieser Form:
{"verbaende":["Bioland"|"Naturland"],"bio":true|false,"oekoKontrollstelle":"DE-ÖKO-0xx oder null","pflanzenpass":true|false,"sorte":"oder null","lieferscheinNr":"oder null","mengeKg":Zahl oder null}
"bio" = Ware als ökologisch/biologisch deklariert. "pflanzenpass" = EU-Pflanzenpass erkennbar. Nur was auf dem Lieferschein steht, nichts erfinden.`;
  try{
    const r=await sample.json(prompt,{images:[dataUrlToBlob(S.lsFoto)],modelTier:"default"});
    const found=new Set(r?.verbaende||[]); const norm=s=>ascii(String(s||"")).replace(/[^A-Z0-9]/g,"");
    S.lsCheck.forEach(row=>{
      if(VERB.includes(row.punkt)){ row.ist=found.has(row.punkt)?"ja":"nicht gefunden"; row.status=found.has(row.punkt)?"ok":"fehlt"; }
      else if(row.punkt==="Öko-Kontrollstelle"){ const v=r?.oekoKontrollstelle; row.ist=v||"nicht gefunden"; row.status=!v?"fehlt":(!norm(row.soll)||norm(row.soll)==="–"||norm(v)===norm(row.soll))?"ok":"abweichend"; }
      else if(row.punkt==="Qualität"){ const bio=!!r?.bio; row.ist=bio?"Bio":"konv. / nicht deklariert"; row.status=(bio===(S.pg.qual==="bio"))?"ok":"abweichend"; }
      else if(row.punkt==="Pflanzenpass"){ row.ist=r?.pflanzenpass?"vorhanden":"nicht gefunden"; row.status=r?.pflanzenpass?"ok":"fehlt"; }
      else if(row.punkt==="Sorte"){ const v=r?.sorte; row.ist=v||"nicht gefunden"; row.status=!v?"fehlt":(!S.pg.sorte||norm(v).includes(norm(S.pg.sorte))||norm(S.pg.sorte).includes(norm(v)))?"ok":"abweichend"; }
    });
    if(!isPG()) VERB.forEach(v=>{ if(found.has(v)&&!S.lsCheck.some(x=>x.punkt===v)) S.lsCheck.push({punkt:v,soll:"nicht hinterlegt",ist:"ja",status:"abweichend"}); });
    if(r?.lieferscheinNr&&!S.lsNr) S.lsNr=String(r.lieferscheinNr);
    if(r?.mengeKg&&!S.menge) S.menge=String(r.mengeKg);
    S.lsMsg="Ausgelesen. Bitte kurz prüfen und bei Bedarf korrigieren.";
  }catch(e){
    S.lsMsg = e?.code==="not_configured" ? "Automatisches Auslesen ist auf dem Server nicht eingerichtet. Bitte Status je Zeile antippen." : e?.code==="offline" ? "Zum Auslesen braucht das Handy Netz. Bitte Status je Zeile antippen." : e?.code==="not_granted" ? "Auslesen wurde nicht erlaubt. Bitte Status je Zeile antippen." : e?.code==="rate_limited" ? "Gerade zu viele Anfragen. Bitte in einer Minute erneut versuchen." : "Lieferschein konnte nicht gelesen werden. Bitte Status je Zeile antippen.";
  }
  S.lsBusy=false; render();
}

    const cw=(W-6)/2; let ch=0;
    imgs.forEach(([t,src],i)=>{ const cc=i%2;
      if(cc===0){ if(i>0) y+=ch+12; ch=Math.min(118,Math.max(...imgs.slice(i,i+2).map(([,s2])=>{ const q=d.getImageProperties(s2); return (cw-4)*q.height/q.width+4; }))); if(y+ch+8>BOTTOM) newPage(); }
      const x=L+cc*(cw+6); const pr=d.getImageProperties(src); const r=Math.min((cw-4)/pr.width,(ch-4)/pr.height); const iw=pr.width*r, ih=pr.height*r;
      fill(C.card); d.roundedRect(x,y,cw,ch,1.8,1.8,"F"); d.addImage(src,"JPEG",x+(cw-iw)/2,y+(ch-ih)/2,iw,ih);
      fill(C.green); d.rect(x,y+ch+1.6,2,3.4,"F"); font("bold",8.5,C.ink); d.text(t,x+4,y+ch+4.6); }); }

  /* ---- Fußzeile ---- */
  const n=d.getNumberOfPages();
  for(let i=1;i<=n;i++){ d.setPage(i); d.setLineWidth(.4); draw(C.blue); d.line(L,280,R,280);
    font("bold",7.4,C.blueDk); d.text(txt(CFG.firma||"Vermarktungsgesellschaft Bio-Bauern mbH"),L,284.5);
    font("normal",7.2,C.grey); d.text(txt(`${titel} · Charge ${S.charge} · elektronisch erstellt am ${stamp} · ohne Unterschrift gültig`),L,288.6);
    font("normal",7.4,C.grey); d.text(`Seite ${i} von ${n}`,R,284.5,{align:"right"}); }
  return d.output("arraybuffer");
}
function pdfEtikett(){
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:"mm",format:[100,50],orientation:"landscape"}); const p=P(), e=S.erz;
  const bc=bcPng(barcodeVal()); const n=etiCount(); const tag=labelTag();
  const klv=isTR()?S.kl.filter(x=>num(x.kg)):[];
  for(let i=0;i<n;i++){ if(i) d.addPage([100,50],"landscape");
    d.setFont("helvetica","bold"); d.setFontSize(8); d.text("VG BIO · RETTERMAYER · WE",4,5);
    d.setFontSize(9); const w=d.getTextWidth(tag)+3; d.setFillColor(0,0,0); d.rect(96-w,1.6,w,4.6,"F"); d.setTextColor(255,255,255); d.text(tag,94.5,5,{align:"right"}); d.setTextColor(0,0,0);
    d.setFont("courier","bold"); d.setFontSize(22); d.text(S.charge,4,15);
    d.setFont("helvetica","bold"); d.setFontSize(10.5); d.text(p.name,96,11,{align:"right"}); d.setFont("helvetica","normal"); d.setFontSize(10); d.text(deDate(S.datum),96,16,{align:"right"});
    if(klv[i]){ d.setFont("helvetica","bold"); d.setFontSize(9); d.text(txt2(`Kiste ${i+1}/${klv.length} · ${klv[i].kal||"-"} · ${deNum(num(klv[i].kg),1)} kg`),4,21.5); d.setFont("helvetica","normal"); }
    d.setFontSize(8); if(!klv[i]) d.text(d.splitTextToSize(`${e.name} · büro+ ${e.buero||"-"}${S.menge?" · "+S.menge+" kg":""}${num(S.kisten)?" · "+kolliText():""}`,92),4,22);
    d.addImage(bc,"PNG",4,26,92,17); d.setFont("courier","normal"); d.setFontSize(8); d.text(barcodeVal(),50,47,{align:"center"});
  }
  return d.output("arraybuffer");
}
function zpl(){
  const p=P(), e=S.erz; const c=s=>String(s).replace(/[\^~]/g,"");
  return ["^XA","^CI28","^PW800","^LL400",`^FO30,20^A0N,26,26^FDVG BIO  RETTERMAYER  WE^FS`,
   `^FO420,12^GB360,40,40^FS`,`^FO420,20^A0N,28,28^FR^FB350,1,0,R^FD${c(labelTag())}^FS`,
   `^FO30,58^A0N,80,70^FD${c(S.charge)}^FS`,`^FO470,60^A0N,32,32^FB300,1,0,R^FD${c(p.name)}^FS`,`^FO470,105^A0N,30,30^FB300,1,0,R^FD${deDate(S.datum)}^FS`,
   `^FO30,160^A0N,26,26^FD${c(e.name)}  bueroplus ${c(e.buero||"-")}${S.menge?"  "+c(S.menge)+" kg":""}${num(S.kisten)?"  "+c(kolliText()):""}^FS`,
   `^FO40,205^BY3^BCN,130,Y,N,N^FD${barcodeVal()}^FS`,`^PQ${etiCount()},0,1,Y`,"^XZ"].join("\n");
}
async function save(filename, data, label){
  if(!downloads){ toast("Speichern ist in dieser Ansicht nicht verfügbar"); return; }
  try{ await downloads.save({filename,data}); toast(label+" gespeichert"); }
  catch(e){ if(e?.code!=="declined") toast("Speichern fehlgeschlagen"); }
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.id==="tab-erf"){view="erf";render();return} if(b.id==="tab-team"){view="team";render();return} if(b.id==="tab-aw"){view="aw";render();return} if(b.id==="tab-ueb"){view="ueb";render();return} if(b.id==="tab-sd"){view="sd";render();return}
  if(b.id==="pdfv-x"){ closePdf(); return; }
  if(b.id==="pdfv-save"){ if(PDFV) save(PDFV.name,PDFV.buf,"Protokoll"); return; }
  if(b.id==="btn-back"){ if(step>0){step--;render();window.scrollTo(0,0);} return; }
  if(b.id==="btn-next"){
    if(step===5){ if(S.saved){ const keep=S.datum; S=fresh(); S.datum=keep; step=0; render(); window.scrollTo(0,0);} else speichern(); return; }
    if(!missing()){ step++; if(step===4 && S.lsCheck && isPG()) S.lsCheck=S.lsCheck.map(r=>r.punkt==="Sorte"&&r.status==="offen"?{...r,soll:S.pg.sorte||"–"}:r.punkt==="Qualität"&&r.status==="offen"?{...r,soll:qualText()}:r); render(); window.scrollTo(0,0);} return;
  }
  const a=b.dataset.act; if(!a) return;
  if(a==="prod"){ if(S.prod!==b.dataset.k){ const keep=S.datum; S=fresh(); S.datum=keep; S.prod=b.dataset.k; S.gebinde=isFR()?"Kiste":isPG()?"Sack":null; } render(); }
  else if(a==="erz"){ const src=isPG()?LIEF:ERZ; const e=src.find(x=>x.id===b.dataset.id); if(S.erz?.id!==e.id){ S.erz=e; S.lsCheck=null; S.verband=new Set(isPG()?[]:(e.verbaende||[])); if(isPG()&&e.land&&!S.pg.land) S.pg.land=e.land; } render(); }
  else if(a==="set"){ const v=JSON.parse(b.dataset.v); const g=b.dataset.g; if(g.includes(".")){ const [o,kk]=g.split("."); S[o][kk]=v; } else S[g]=v; render(); }
  else if(a==="pgset"){ S.pg[b.dataset.f]=b.dataset.v; if(b.dataset.f==="qual") S.lsCheck=null; render(); }
  else if(a==="kal"){ S.kal[+b.dataset.i]=+b.dataset.v; render(); }
  else if(a==="kal-rest"){ const i=+b.dataset.i; S.kal[i]=Math.max(0,100-(kalSumme()-(S.kal[i]||0))); render(); }
  else if(a==="mg"){ S.mg[+b.dataset.i]=+b.dataset.r; render(); }
  else if(a==="ernte"){ S.ernte=b.dataset.v; render(); }
  else if(a==="verb"){ const v=b.dataset.v; S.verband.has(v)?S.verband.delete(v):S.verband.add(v); render(); }
  else if(a==="ls-del"){ S.lsFoto=null; S.lsCheck=null; S.lsMsg=""; render(); }
  else if(a==="ls-read"){ lsRead(); }
  else if(a==="ls-st"){ S.lsCheck[+b.dataset.i].status=b.dataset.s; render(); }
  else if(a==="foto-del"){ S.fotos.splice(+b.dataset.i,1); render(); }
  else if(a==="dl-pdf"){ save(`WE_${barcodeVal()}_${S.datum}.pdf`, pdfProtokoll(), "Protokoll"); }
  else if(a==="dl-csv1"){ const rec=S.rec?{...S.rec}:null; if(rec) csvExport([rec],false); }
  else if(a==="eti-minus"){ S.etiAnz=Math.max(1,etiCount()-1); $("#f-eti").value=S.etiAnz; }
  else if(a==="eti-plus"){ S.etiAnz=Math.min(999,etiCount()+1); $("#f-eti").value=S.etiAnz; }
  else if(a==="send-mail"){ sendMail(); }
  else if(a==="dl-label"){ save(`Etikett_${barcodeVal()}_${etiCount()}St.pdf`, pdfEtikett(), etiCount()+" Etiketten"); }
  else if(a==="dl-zpl"){ save(`Etikett_${barcodeVal()}.zpl.txt`, new TextEncoder().encode(zpl()).buffer, "ZPL-Datei"); }
  else if(a==="copy-zpl"){ copy(zpl()); }
  else if(a==="aw-csv"){ awCsv(); }
  else if(a==="go-team"){ view="team"; render(); window.scrollTo(0,0); }
  else if(a==="kein-ls"){ S.keinLs=!S.keinLs; if(S.keinLs){ S.lsFoto=null; S.lsMsg=""; } render(); }
  else if(a==="logout"){ if(window.RWE) RWE.logout(); }
  else if(a==="u-reload"){ USERS=null; render(); }
  else if(a==="u-new"){ userNew(); }
  else if(a==="u-save"){ userSave(b.dataset.id); }
  else if(a==="pdf-open"){ const v=VORG.find(x=>x.id===b.dataset.id); if(v) openBlob(v.protokollPdf,`WE_${v.barcode||""}_${v.datum}.pdf`,"Protokoll "+v.charge); }
  else if(a==="pdf-view"){ showPdf(pdfProtokoll(),`WE_${barcodeVal()}_${S.datum}.pdf`,"Protokoll "+S.charge); }
  else if(a==="pdf-make"){ vorgPdf(b.dataset.id); }
  else if(a==="draft-go"){ resumeDraft(b.dataset.id); }
  else if(a==="draft-del"){ deleteDraft(b.dataset.id); }
  else if(a==="kl-add"){ klAdd(+b.dataset.n); }
  else if(a==="kl-del"){ curKL().splice(+b.dataset.i,1); render(); }
  else if(a==="kl-edit"){ const v=VORG.find(x=>x.id===b.dataset.id); const l=(v.kistenListe||[]).map(x=>({kal:x.kal,kg:String(x.kg).replace(".",",")})); S.kEdit={id:v.id,charge:v.charge,ls:v.mengeKg,liste:l.length?l.map(x=>({...x,kg:String(num(x.kg))})):[{kal:"",kg:""}]}; render(); window.scrollTo(0,0); }
  else if(a==="kl-save"){ klSave(); }
  else if(a==="kl-cancel"){ S.kEdit=null; render(); }
  else if(a==="filt"){ filt=b.dataset.k; render(); }
  else if(a==="muster-mail"){ musterSenden(); }
  else if(a==="csv-neu"){ csvExport(vorgListe().filter(v=>v.status==="offen"),true); }
  else if(a==="csv-alle"){ csvExport(vorgListe(),true); }
  else if(a==="gebucht"){ setGebucht(b.dataset.id); }
  else if(a==="sd-new"){ S.sdEdit={_t:b.dataset.t, verbaende:b.dataset.t==="erz"?["Bioland"]:[]}; render(); }
  else if(a==="sd-edit"){ const src=b.dataset.t==="erz"?ERZ:LIEF; S.sdEdit={...src.find(x=>x.id===b.dataset.id),_t:b.dataset.t}; render(); }
  else if(a==="sd-cancel"){ S.sdEdit=null; render(); }
  else if(a==="sd-save"){ saveStamm(); }
  else if(a==="save-prod"){ saveProd(); }
  else if(a==="save-cfg"){ saveCfg(); }
  else if(a==="save-firma"){ saveFirma(); }
  else if(a==="logo-del"){ CFG.logoId=""; LOGO=null; saveFirma(); }
});
const PGF={"pg-prob":"probennehmer","pg-land":"land","pg-sorte":"sorte","pg-kal":"kaliber","pg-brech":"brech","pg-gew":"gewicht","pg-anz":"anzahl","pg-eind":"eindruck"};
document.addEventListener("input", ev=>{
  const t=ev.target, id=t.id;
  if(id==="erz-q"){ S.q=t.value; const pos=t.selectionStart; render(); const n=$("#erz-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(PGF[id]){ S.pg[PGF[id]]=t.value; if(id==="pg-gew"||id==="pg-anz") updPg(); else if(id==="pg-sorte") S.lsCheck=null; }
  else if(id.startsWith("pg-c-")){ S.pg.cnt[+id.slice(5)]=t.value; updPg(); }
  else if(id.startsWith("pg-a-")){ S.pg.anm[+id.slice(5)]=t.value; }
  else if(id.startsWith("kl-kg-")){ const l=curKL(), i=+id.slice(6); if(l&&l[i]){ const v=num(t.value); if(v!==null&&(v>KISTE_MAX||v<0)){ t.value=l[i].kg??""; t.style.borderColor="var(--bad)"; setTimeout(()=>t.style.borderColor="",1500); toast(v<0?"Gewicht kann nicht negativ sein":"Eine Kiste kann höchstens 1.000 kg haben"); return; } l[i].kg=t.value; updKL(); } }
  else if(id==="f-menge"){ S.menge=t.value; const pb=$("#plausi-box"); if(pb) pb.innerHTML=plausiBox(); updKL(); }
  else if(id==="f-kisten"){ S.kisten=t.value; S.etiAnz=null; const pb=$("#plausi-box"); if(pb) pb.innerHTML=plausiBox(); }
  else if(id==="f-pal") S.paletten=t.value;
  else if(id==="f-eti"){ const v=parseInt(t.value,10); S.etiAnz=isNaN(v)?null:Math.min(999,Math.max(1,v)); }
  else if(id==="f-lsnr") S.lsNr=t.value; else if(id==="f-bem") S.bem=t.value;
  if(view==="erf"){ updBar(); scheduleDraft(); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape"&&PDFV){ closePdf(); return; }
  const t=ev.target; if(ev.key!=="Enter"||!t.id||!t.id.startsWith("kl-kg-")) return; ev.preventDefault();
  const i=+t.id.slice(6), l=curKL(); if(i>=l.length-1) klAdd(1); else { const n=$("#kl-kg-"+(i+1)); if(n){ n.focus(); n.select(); } }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(t.id==="f-datum"){ S.datum=t.value; render(); }
  else if(t.id==="aw-k"){ AW.prod=t.value; AW.saison=null; AW.vgl="auto"; render(); }
  else if(t.id==="aw-s"){ AW.saison=+t.value; AW.vgl="auto"; render(); }
  else if(t.id==="aw-v"){ AW.vgl=t.value; render(); }
  else if(t.id==="aw-gleich"){ AW.gleich=t.checked; render(); }
  else if(t.id==="aw-demo"){ AW.demo=t.checked; AW.saison=null; render(); }
  else if(t.id==="pg-probd"){ S.pg.probeDatum=t.value; }
  else if(t.id==="pg-auftr"){ S.pg.auftrag=t.value; }
  else if(t.id.startsWith("kl-kal-")){ const l=curKL(); if(l&&l[+t.id.slice(7)]){ l[+t.id.slice(7)].kal=t.value; updKL(); } }
  else if(t.id==="cfg-logo" && t.files[0]){ logoHochladen(t.files[0]); }
  else if((t.id==="f-ls"||t.id==="f-ls-cam") && t.files[0]){ try{ S.lsFoto=await readImg(t.files[0],1400,0.72); S.lsCheck=lsRows(); S.lsMsg=""; }catch(e){ toast("Bild konnte nicht gelesen werden"); } render(); }
  else if((t.id==="f-fotos"||t.id==="f-fotos-cam") && t.files.length){ for(const f of t.files){ try{ S.fotos.push(await readImg(f,1100,0.68)); }catch(e){} } render(); }
});

/* ---------- Start ---------- */
render();
(async()=>{
  if(!window.claude){ demo=true; render(); return; }
  [db, sample, downloads, mcp, assets, user] = await Promise.all(["db","sample","downloads","mcp","assets","user"].map(n=>claude.use(n).catch(()=>null)));
  if(user){ try{ ME=(await user.id())||ME; }catch(_){} }
  if(window.RWE){ $("#tab-sd").hidden=!RWE.isAdmin(); if(view==="sd"&&!RWE.isAdmin()) view="erf"; render(); }
  if(!db){ demo=true; render(); return; }
  const editing=()=>view==="sd"&&S.sdEdit;
  const quietErf=()=>view==="erf"&&step!==2&&step!==3&&step!==4;
  db.collection("erzeuger").onSnapshot(s=>{ ERZ=s.docs.map(d=>({id:d.id,...d.data()})); loaded=true; if(S.erz&&!isPG()) S.erz=ERZ.find(x=>x.id===S.erz.id)||S.erz; if(!editing()&&(view!=="erf"||step<2)) render(); });
  db.collection("lieferanten").onSnapshot(s=>{ LIEF=s.docs.map(d=>({id:d.id,...d.data()})); if(S.erz&&isPG()) S.erz=LIEF.find(x=>x.id===S.erz.id)||S.erz; if(!editing()&&(view!=="erf"||step<2)) render(); });
  db.collection("entwuerfe").onSnapshot(s=>{ DRAFTS=s.docs.map(d=>({id:d.id,...d.data()})); if(view==="erf"&&step===0) render(); });
  db.collection("zaehler").onSnapshot(s=>{ CNT={}; s.docs.forEach(d=>CNT[d.id]=d.data().n||0); if(quietErf()) render(); });
  db.collection("wareneingaenge").orderBy("erstellt","desc").limit(1000).onSnapshot(s=>{ VORG=s.docs.map(d=>({id:d.id,...d.data()})); if((view==="ueb"&&!S.kEdit)||view==="team"||view==="aw"||(view==="erf"&&step===0)) render(); });
  db.doc("config/produkte").onSnapshot(s=>{ if(s.exists&&Array.isArray(s.data().liste)){ PROD=PROD_DEFAULT.map(def=>({...def,...(s.data().liste.find(x=>x.k===def.k)||{})})); if(view!=="sd"&&quietErf()) render(); } });
  db.doc("config/allgemein").onSnapshot(s=>{ if(s.exists){ const old=CFG.logoId; CFG={...CFG_DEFAULT,...s.data()}; if(CFG.logoId&&CFG.logoId!==old) ladeLogo(); if(view==="sd"&&!S.sdEdit) render(); } });
})();
